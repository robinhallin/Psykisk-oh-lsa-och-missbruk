<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0f2d3a" />
  <meta name="description" content="Interaktiv studieportal för Polisiärt arbete vid psykisk ohälsa och sjukdom samt missbruk." />
  <title>Studieportal V6 · Psykisk ohälsa & polisiärt arbete</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a class="skip-link" href="#main">Hoppa till innehåll</a>

  <header class="topbar">
    <button class="brand" data-nav="home" aria-label="Till startsidan">
      <span class="brand-mark" aria-hidden="true">P</span>
      <span><strong>Studieportal <i class="version">V6</i></strong><small>Psykisk ohälsa · missbruk · polisiärt arbete</small></span>
    </button>
    <nav class="topnav" aria-label="Huvudmeny">
      <button data-nav="modules">Moduler</button>
      <button data-nav="lawguide">Lagguide</button>
      <button data-nav="goals">Lärandemål</button>
      <button data-nav="praxis">Praxis</button>
      <button data-nav="review">Repetition</button>
      <button data-nav="exam">Tentamen</button>
      <button data-nav="cases">Case</button>
      <button data-nav="lab">Träningslabb</button>
    </nav>
    <div class="top-actions">
      <button class="icon-btn" id="searchBtn" title="Sök (/)" aria-label="Sök">⌕</button>
      <button class="icon-btn" id="themeBtn" title="Växla tema" aria-label="Växla färgtema">◐</button>
    </div>
  </header>

  <aside class="sidebar" id="sidebar" aria-label="Studieverktyg">
    <div class="progress-card">
      <div class="progress-ring" id="progressRing"><span id="progressPct">0%</span></div>
      <div><strong>Modulprogress</strong><small id="progressText">0 av 0 moduler behärskade</small></div>
    </div>
    <button class="side-link active" data-nav="home">⌂ <span>Min dashboard</span></button>
    <button class="side-link" data-nav="modules">▦ <span>Alla moduler</span></button>
    <button class="side-link" data-nav="symptom">◉ <span>Symtomkompass</span></button>
    <button class="side-link" data-nav="laws">§ <span>Lagrumsbanken</span></button>
    <button class="side-link" data-nav="lawguide">⌘ <span>Interaktiv lagguide</span></button>
    <button class="side-link" data-nav="goals">◎ <span>Lärandemål</span></button>
    <button class="side-link" data-nav="praxis">⚖ <span>Praxis & gråzoner</span></button>
    <button class="side-link" data-nav="review">↻ <span>Smart repetition</span></button>
    <button class="side-link" data-nav="exam">✓ <span>Tentamensmotor</span></button>
    <button class="side-link" data-nav="cases">◇ <span>Case-tränare</span></button>
    <button class="side-link" data-nav="lab">◉ <span>Träningslabb</span></button>
    <button class="side-link" data-nav="notes">✎ <span>Mina anteckningar</span></button>
    <button class="side-link" data-nav="sources">i <span>Källor & avgränsning</span></button>
    <div class="sidebar-tip"><strong>V6-princip</strong><p>Lärandemål → träna → praxis → testa → repetera. Sidan sparar din progression lokalt.</p></div>
  </aside>

  <main id="main" tabindex="-1"></main>

  <div class="search-overlay" id="searchOverlay" hidden>
    <div class="search-panel" role="dialog" aria-modal="true" aria-labelledby="searchTitle">
      <div class="search-head"><h2 id="searchTitle">Sök i kursen</h2><button id="searchClose" class="icon-btn" aria-label="Stäng sökning">×</button></div>
      <input id="searchInput" type="search" autocomplete="off" placeholder="Sök t.ex. LPT 47, hallucinationer, PL 12 a, cannabis…" />
      <div id="searchResults" class="search-results"></div>
      <small>Tips: tryck <kbd>/</kbd> för att öppna och <kbd>Esc</kbd> för att stänga.</small>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="module-v6.js"></script>
  <script src="app.js"></script>
</body>
</html>
