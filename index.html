<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0f2d3a" />
  <meta name="description" content="Interaktiv studiesida för kursen Polisiärt arbete vid psykisk ohälsa och sjukdom samt missbruk." />
  <title>Polisiärt arbete vid psykisk ohälsa – Studieportal</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a class="skip-link" href="#main">Hoppa till innehåll</a>

  <header class="topbar">
    <button class="brand" data-nav="home" aria-label="Till startsidan">
      <span class="brand-mark" aria-hidden="true">P</span>
      <span><strong>Studieportal</strong><small>Psykisk ohälsa · missbruk · polisiärt arbete</small></span>
    </button>
    <nav class="topnav" aria-label="Huvudmeny">
      <button data-nav="modules">Moduler</button>
      <button data-nav="laws">Lagrum</button>
      <button data-nav="flashcards">Kort</button>
      <button data-nav="quiz">Quiz</button>
      <button data-nav="cases">Case</button>
    </nav>
    <div class="top-actions">
      <button class="icon-btn" id="searchBtn" title="Sök (/)" aria-label="Sök">⌕</button>
      <button class="icon-btn" id="themeBtn" title="Växla tema" aria-label="Växla färgtema">◐</button>
    </div>
  </header>

  <aside class="sidebar" id="sidebar" aria-label="Studieverktyg">
    <div class="progress-card">
      <div class="progress-ring" id="progressRing"><span id="progressPct">0%</span></div>
      <div><strong>Din progression</strong><small id="progressText">0 av 0 moduler klara</small></div>
    </div>
    <button class="side-link active" data-nav="home">⌂ <span>Översikt</span></button>
    <button class="side-link" data-nav="modules">▦ <span>Alla moduler</span></button>
    <button class="side-link" data-nav="symptom">◉ <span>Symtomkompass</span></button>
    <button class="side-link" data-nav="laws">§ <span>Lagrumsbanken</span></button>
    <button class="side-link" data-nav="flashcards">▱ <span>Flashcards</span></button>
    <button class="side-link" data-nav="quiz">✓ <span>Quiz & tentaträning</span></button>
    <button class="side-link" data-nav="cases">◇ <span>Polisiära case</span></button>
    <button class="side-link" data-nav="notes">✎ <span>Mina anteckningar</span></button>
    <button class="side-link" data-nav="sources">i <span>Källor & avgränsning</span></button>
    <div class="sidebar-tip"><strong>Pluggprincip</strong><p>Läs → återkalla → tillämpa. Börja inte med att läsa om allt; testa dig först.</p></div>
  </aside>

  <main id="main" tabindex="-1"></main>

  <div class="search-overlay" id="searchOverlay" hidden>
    <div class="search-panel" role="dialog" aria-modal="true" aria-labelledby="searchTitle">
      <div class="search-head"><h2 id="searchTitle">Sök i kursen</h2><button id="searchClose" class="icon-btn">×</button></div>
      <input id="searchInput" type="search" autocomplete="off" placeholder="Sök t.ex. LPT 47, hallucinationer, ADHD, cannabis…" />
      <div id="searchResults" class="search-results"></div>
      <small>Tips: tryck <kbd>/</kbd> för att öppna och <kbd>Esc</kbd> för att stänga.</small>
    </div>
  </div>

  <template id="toastTemplate"><div class="toast"></div></template>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
